name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 5 minutes so Render (which sleeps after 15 mins) NEVER spins down
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI to test anytime

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Server
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || secrets.BACKEND_URL || 'https://ai-recruitment-platform-2iwv.onrender.com' }}
        run: |
          TARGET="${RENDER_BACKEND_URL}"
          
          # Default to live production Render deployment if no secret was supplied
          if [ -z "$TARGET" ]; then
            TARGET="https://ai-recruitment-platform-2iwv.onrender.com"
          fi

          # Strip trailing slash if present
          TARGET="${TARGET%/}"

          # Ensure URL starts with https:// or http://
          if [[ ! "$TARGET" =~ ^https?:// ]]; then
            TARGET="https://${TARGET}"
          fi

          echo "Target Backend: ${TARGET}"

          # 1. Ping /health endpoint
          HEALTH_ENDPOINT="${TARGET}/health"
          echo "Pinging ${HEALTH_ENDPOINT}..."
          HEALTH_RESP=$(curl -sSL -w "\nHTTP_STATUS:%{http_code}" --max-time 60 "$HEALTH_ENDPOINT")
          STATUS=$(echo "$HEALTH_RESP" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$HEALTH_RESP" | grep -v "HTTP_STATUS")
          echo "Health Status Code: $STATUS"
          echo "Health Body: $BODY"

          # 2. Ping /students/target-roles endpoint to prime DB & route cache
          ROLES_ENDPOINT="${TARGET}/students/target-roles"
          echo "Pinging ${ROLES_ENDPOINT}..."
          ROLES_RESP=$(curl -sSL -w "\nHTTP_STATUS:%{http_code}" --max-time 60 "$ROLES_ENDPOINT")
          ROLES_STATUS=$(echo "$ROLES_RESP" | grep "HTTP_STATUS" | cut -d':' -f2)
          echo "Roles Status Code: $ROLES_STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "SUCCESS: Render backend is awake, hot, and healthy!"
          else
            echo "NOTICE: Backend responded with status $STATUS. (Wake-up signal delivered to container)."
          fi
